[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pneumonia-vision-transformer"
version = "0.1.0"
description = "Efficient Vision Transformer (ViT + Linformer) for pneumonia detection in chest X-rays"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Kanishka Ranaweera", email = "kanishkadasun@gmail.com" },
]
keywords = ["vision-transformer", "vit", "linformer", "pneumonia", "chest-xray", "medical-imaging"]
dependencies = [
    "torch>=1.13",
    "torchvision>=0.14",
    "vit-pytorch>=1.0",
    "linformer>=0.2",
    "scikit-learn>=1.1",
    "pillow>=9.0",
    "tqdm>=4.64",
    "numpy>=1.23",
]

[tool.setuptools]
packages = ["pneumonia_vit"]
